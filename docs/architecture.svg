<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 920" width="1520" height="920">
  <defs>
    <style>
      .t-sans { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .sec-title { font-size: 16px; font-weight: 700; fill: #1F2937; }
      .sub-title { font-size: 14px; font-weight: 700; fill: #1F2937; }
      .card-title { font-size: 13.5px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .card-sub { font-size: 11.5px; font-weight: 500; fill: #4B5563; text-anchor: middle; }
      .node-title { font-size: 12px; font-weight: 700; fill: #111827; text-anchor: middle; }
      .node-sub { font-size: 10.5px; font-weight: 500; fill: #4B5563; text-anchor: middle; }
      .edge-label { font-size: 10px; font-weight: 600; fill: #374151; text-anchor: middle; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1F2937" />
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.8 L 9 5 L 1 8.2 z" fill="#374151" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.8 L 9 5 L 1 8.2 z" fill="#B45309" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1520" height="920" fill="#FFFFFF" class="t-sans" />

  <!-- ================= 1. 外层容器：主 Graph ================= -->
  <rect x="24" y="18" width="1472" height="716" rx="14" fill="#FFFDF7" stroke="#DCD8CE" stroke-width="1.5" />
  <text x="44" y="45" class="t-sans sec-title">主 Graph</text>

  <!-- RuntimeContext 卡片 -->
  <rect x="132" y="62" width="268" height="98" rx="10" fill="#E8E2FC" stroke="#1F2937" stroke-width="1.6" />
  <text x="266" y="88" class="t-sans card-title">RuntimeContext</text>
  <text x="266" y="111" class="t-sans card-sub">user_id · JWT Bearer 鉴权</text>
  <text x="266" y="131" class="t-sans card-sub">guardrail_buffer 流式缓冲 · AsyncPostgresSaver</text>

  <!-- AgentState 卡片 -->
  <rect x="1120" y="62" width="268" height="98" rx="10" fill="#E8E2FC" stroke="#1F2937" stroke-width="1.6" />
  <text x="1254" y="88" class="t-sans card-title">AgentState</text>
  <text x="1254" y="111" class="t-sans card-sub">messages 历史消息 · UserProfile 增量画像</text>
  <text x="1254" y="131" class="t-sans card-sub">additional_info · pending_interrupt 防覆写</text>

  <!-- 主图入口 START & RouteNode -->
  <rect x="690" y="34" width="140" height="44" rx="8" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.6" />
  <text x="760" y="61" class="t-sans card-title">START</text>

  <line x1="760" y1="78" x2="760" y2="106" stroke="#1F2937" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="580" y="109" width="360" height="58" rx="9" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.6" />
  <text x="760" y="134" class="t-sans card-title">RouteNode (意图识别)</text>
  <text x="760" y="154" class="t-sans card-sub">规则寒暄毫秒直出 + 结构化 5 路意图分发</text>

  <!-- ================= 2. 内嵌容器：子工作流 ================= -->
  <rect x="46" y="216" width="1428" height="500" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4" />
  <text x="64" y="241" class="t-sans sub-title">子工作流</text>

  <!-- RouteNode 到 5 个子工作流的虚线路由箭头 -->
  <path d="M 760 167 C 760 202, 294 198, 294 252" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 760 167 C 760 202, 690 202, 690 252" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 760 167 C 760 202, 964 202, 964 252" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 760 167 C 760 200, 1170 200, 1170 252" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 760 167 C 760 198, 1364 198, 1364 252" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />

  <!-- -------- 子工作流 1: RecommendationPlanWorkflow -------- -->
  <rect x="66" y="256" width="456" height="444" rx="10" fill="#EBF5EF" stroke="#C5DDD0" stroke-width="1.4" />
  <text x="294" y="279" class="t-sans card-title">RecommendationPlanWorkflow</text>
  <text x="294" y="297" class="t-sans card-sub">保险组合推荐 · 条款依据问答 · 护栏纠偏 · 审批落库</text>

  <!-- Row 1: START -> extract_profile -->
  <rect x="86" y="311" width="76" height="30" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="124" y="330" class="t-sans node-title">START</text>
  <line x1="162" y1="326" x2="195" y2="326" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <rect x="198" y="311" width="174" height="30" rx="7" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.4" />
  <text x="285" y="330" class="t-sans node-title">extract_profile (正则画像)</text>

  <!-- extract_profile -> advisor_agent -->
  <line x1="285" y1="341" x2="285" y2="358" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Row 2: advisor_agent (LLM) -->
  <rect x="198" y="361" width="174" height="38" rx="8" fill="#FEF3C7" stroke="#1F2937" stroke-width="1.5" />
  <text x="285" y="378" class="t-sans node-title">advisor_agent (LLM)</text>
  <text x="285" y="393" class="t-sans node-sub">ReAct 多工具协同</text>

  <!-- Tools & collect loop -->
  <rect x="86" y="427" width="116" height="40" rx="8" fill="#FEF3C7" stroke="#1F2937" stroke-width="1.5" />
  <text x="144" y="444" class="t-sans node-title">Tools</text>
  <text x="144" y="459" class="t-sans node-sub">搜推 · RAG · 试算</text>

  <rect x="226" y="430" width="142" height="34" rx="7" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.4" />
  <text x="297" y="451" class="t-sans node-title">collect 收集来源与草稿</text>

  <!-- advisor_agent <-> Tools <-> collect -->
  <path d="M 244 399 C 244 414, 144 407, 144 424" fill="none" stroke="#374151" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />
  <line x1="202" y1="447" x2="223" y2="447" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="297" y1="430" x2="297" y2="402" stroke="#374151" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />

  <!-- advisor_agent -> verify_response (along x=408, well clear of retry line at x=500) -->
  <path d="M 372 380 L 408 380 L 408 483" fill="none" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- Row 4: verify_response 确定性护栏 -->
  <rect x="212" y="486" width="272" height="42" rx="8" fill="#FDE68A" stroke="#1F2937" stroke-width="1.5" />
  <text x="348" y="504" class="t-sans node-title">verify_response 双层确定性护栏</text>
  <text x="348" y="520" class="t-sans node-sub">引文防伪造校验 + 年龄/职业/预算硬约束</text>

  <!-- Retry loop: verify_response -> advisor_agent along x=501 -->
  <path d="M 484 503 L 501 503 L 501 371 L 375 371" fill="none" stroke="#B45309" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" />
  <rect x="424" y="359" width="70" height="17" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.9" />
  <text x="459" y="371" class="t-sans edge-label" style="fill:#92400E;">违约单次重试</text>

  <!-- Row 5: Two output paths -->
  <!-- Left branch: deliver_answer -> END -->
  <path d="M 296 528 L 276 551" fill="none" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <rect x="210" y="554" width="132" height="38" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="276" y="571" class="t-sans node-title">deliver_answer</text>
  <text x="276" y="586" class="t-sans node-sub">直出 / fail-closed 兜底</text>

  <line x1="276" y1="592" x2="276" y2="622" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <rect x="234" y="625" width="84" height="28" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="276" y="643" class="t-sans node-title">END</text>

  <!-- Right branch: plan_confirm (HITL) -> save_plan -> END -->
  <path d="M 398 528 L 418 551" fill="none" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <rect x="354" y="554" width="134" height="38" rx="7" fill="#DBEAFE" stroke="#1F2937" stroke-width="1.5" />
  <text x="421" y="571" class="t-sans node-title">plan_confirm (HITL)</text>
  <text x="421" y="586" class="t-sans node-sub">interrupt 等待人工审批</text>

  <!-- Reject dashed line: plan_confirm -> advisor_agent along outer right track x=513 -->
  <path d="M 488 573 L 513 573 L 513 389 L 375 389" fill="none" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />
  <rect x="444" y="534" width="60" height="17" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.8" />
  <text x="474" y="546" class="t-sans edge-label">reject 回流</text>

  <line x1="421" y1="592" x2="421" y2="611" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <rect x="354" y="614" width="134" height="28" rx="6" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="421" y="632" class="t-sans node-title">save_plan 落库+推卡</text>

  <line x1="421" y1="642" x2="421" y2="660" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <rect x="379" y="663" width="84" height="26" rx="6" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="421" y="680" class="t-sans node-title">END</text>

  <!-- -------- 子工作流 2: ClaimWorkflow -------- -->
  <rect x="536" y="256" width="308" height="444" rx="10" fill="#EBF5EF" stroke="#C5DDD0" stroke-width="1.4" />
  <text x="690" y="279" class="t-sans card-title">ClaimWorkflow</text>
  <text x="690" y="297" class="t-sans card-sub">保单查询 · 理赔指南 · 条款护栏问答</text>

  <rect x="644" y="311" width="92" height="30" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="690" y="330" class="t-sans node-title">START</text>
  <line x1="690" y1="341" x2="690" y2="357" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <rect x="612" y="360" width="156" height="28" rx="6" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.4" />
  <text x="690" y="378" class="t-sans node-title">reset_turn 重置状态</text>
  <line x1="690" y1="388" x2="690" y2="404" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <rect x="606" y="407" width="168" height="38" rx="8" fill="#FEF3C7" stroke="#1F2937" stroke-width="1.5" />
  <text x="690" y="424" class="t-sans node-title">claim_agent (LLM)</text>
  <text x="690" y="439" class="t-sans node-sub">保单 · 理赔指南 · 条款</text>

  <rect x="550" y="474" width="114" height="42" rx="8" fill="#FEF3C7" stroke="#1F2937" stroke-width="1.5" />
  <text x="607" y="492" class="t-sans node-title">Tools</text>
  <text x="607" y="508" class="t-sans node-sub">保单 · 指南 · RAG</text>

  <rect x="688" y="478" width="136" height="34" rx="7" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.4" />
  <text x="756" y="499" class="t-sans node-title">collect 收集引文</text>

  <!-- claim_agent <-> Tools <-> collect -->
  <path d="M 650 445 C 650 460, 607 454, 607 471" fill="none" stroke="#374151" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />
  <line x1="664" y1="495" x2="685" y2="495" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <path d="M 756 478 C 756 462, 730 464, 730 448" fill="none" stroke="#374151" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />

  <!-- claim_agent -> verify_claim along x=826 -->
  <path d="M 774 430 L 824 430 L 824 538 L 742 538 L 742 553" fill="none" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <!-- verify_claim -->
  <rect x="626" y="556" width="194" height="42" rx="8" fill="#FDE68A" stroke="#1F2937" stroke-width="1.5" />
  <text x="723" y="574" class="t-sans node-title">verify_claim 确定性护栏</text>
  <text x="723" y="590" class="t-sans node-sub">拦截伪引文 · 单次纠偏/剥离</text>

  <!-- verify_claim -> claim_agent retry loop -->
  <path d="M 820 577 L 836 577 L 836 418 L 777 418" fill="none" stroke="#B45309" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-amber)" />
  <rect x="782" y="396" width="52" height="16" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.9" />
  <text x="808" y="407.5" class="t-sans edge-label" style="fill:#92400E;">纠偏重试</text>

  <!-- verify_claim -> END -->
  <line x1="723" y1="598" x2="723" y2="632" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />
  <rect x="679" y="635" width="88" height="30" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="723" y="654" class="t-sans node-title">END</text>

  <!-- -------- 子工作流 3: ChitchatWorkflow -------- -->
  <rect x="858" y="256" width="212" height="334" rx="10" fill="#EBF5EF" stroke="#C5DDD0" stroke-width="1.4" />
  <text x="964" y="279" class="t-sans card-title">ChitchatWorkflow</text>
  <text x="964" y="297" class="t-sans card-sub">边界内闲聊与服务引导</text>

  <rect x="918" y="330" width="92" height="32" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="964" y="350" class="t-sans node-title">START</text>

  <!-- Left direct rule bypass with clean pill badge -->
  <path d="M 940 362 C 940 392, 886 396, 886 438 C 886 476, 940 480, 940 508" fill="none" stroke="#4B5563" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />
  <rect x="862" y="427" width="52" height="18" rx="4" fill="#EBF5EF" />
  <text x="888" y="439.5" class="t-sans edge-label" style="fill:#374151;">规则直出</text>

  <!-- Right LLM path -->
  <path d="M 972 362 C 972 384, 1002 384, 1002 408" fill="none" stroke="#4B5563" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow-muted)" />
  <rect x="958" y="411" width="88" height="38" rx="8" fill="#FEF3C7" stroke="#1F2937" stroke-width="1.5" />
  <text x="1002" y="434" class="t-sans node-title">LLM</text>
  <path d="M 1002 449 C 1002 478, 976 478, 976 508" fill="none" stroke="#1F2937" stroke-width="1.6" marker-end="url(#arrow)" />

  <rect x="918" y="511" width="92" height="32" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="964" y="531" class="t-sans node-title">END</text>

  <!-- -------- 子工作流 4: human_handoff -------- -->
  <rect x="1084" y="256" width="172" height="114" rx="10" fill="#EBF5EF" stroke="#C5DDD0" stroke-width="1.4" />
  <text x="1170" y="286" class="t-sans card-title">human_handoff</text>
  <text x="1170" y="312" class="t-sans card-sub">转人工上下文摘要</text>
  <text x="1170" y="334" class="t-sans node-sub">同步已识别画像与最新诉求</text>

  <!-- -------- 子工作流 5: fallback -------- -->
  <rect x="1270" y="256" width="188" height="114" rx="10" fill="#EBF5EF" stroke="#C5DDD0" stroke-width="1.4" />
  <text x="1364" y="286" class="t-sans card-title">fallback</text>
  <text x="1364" y="312" class="t-sans card-sub">无法识别时的兜底引导</text>
  <text x="1364" y="334" class="t-sans node-sub">结合上轮工作流提示补充</text>

  <!-- ================= 3. 外层容器：工具与引擎层 ================= -->
  <rect x="24" y="752" width="1472" height="150" rx="14" fill="#FFFFFF" stroke="#DCD8CE" stroke-width="1.5" />
  <text x="44" y="779" class="t-sans sec-title">工具与引擎层</text>

  <!-- 工具层 3 张核心引擎卡 -->
  <rect x="76" y="796" width="424" height="90" rx="10" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.6" />
  <text x="288" y="822" class="t-sans card-title">四阶段搜推漏斗 &amp; 官方费率引擎</text>
  <text x="288" y="845" class="t-sans card-sub">12 款真实产品 · RRF 召回 · 承保硬过滤 · 5 维精排 · 预算背包</text>
  <text x="288" y="866" class="t-sans card-sub">11/12 官方精算 PDF 费率表查表试算 (ID=1 显式区间估算)</text>

  <rect x="530" y="796" width="452" height="90" rx="10" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.6" />
  <text x="756" y="822" class="t-sans card-title">跨产品混合 RAG 检索增强</text>
  <text x="756" y="845" class="t-sans card-sub">领域词典改写 · 并行定额 Round-Robin · 路径去重 · gte-rerank-v2</text>
  <text x="756" y="866" class="t-sans card-sub">彻底移除无条款兜底编造 · 强制 [ref-xxx] 原文溯源</text>

  <rect x="1012" y="796" width="458" height="90" rx="10" fill="#EEF2FA" stroke="#1F2937" stroke-width="1.6" />
  <text x="1241" y="822" class="t-sans card-title">全栈业务服务 &amp; 持久化层</text>
  <text x="1241" y="845" class="t-sans card-sub">31 个 REST 接口 (JWT/试算/方案保单/理赔指南/幂等下单)</text>
  <text x="1241" y="866" class="t-sans card-sub">PostgreSQL 16 (AsyncPostgresSaver) · Milvus 3.0 · 私行暖玉前端</text>

  <!-- Smooth unified stems from Tools to 工具与引擎层 -->
  <!-- 1) RecommendationPlan Tools (144, 467) -> (168, 724) -> split smoothly to all 3 engine cards -->
  <path d="M 144 467 L 144 714 C 144 726, 168 726, 168 738 C 168 766, 260 762, 260 793" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 168 738 C 168 766, 686 744, 686 793" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 168 738 C 168 762, 1170 734, 1170 793" fill="none" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-muted)" />

  <!-- 2) ClaimWorkflow Tools (607, 516) -> (584, 728) -> split smoothly to RAG & 业务层 -->
  <path d="M 607 516 C 607 536, 584 540, 584 562 L 584 728 C 584 764, 786 756, 786 793" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
  <path d="M 584 728 C 584 760, 1272 748, 1272 793" fill="none" stroke="#1F2937" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-muted)" />
</svg>
